<svg viewBox="0 0 1240 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#00000018"/>
    </filter>
  </defs>

  <rect width="1240" height="560" rx="16" fill="#FAFAF8"/>

  <text x="620" y="46" text-anchor="middle" fill="#1B1B1F" font-size="28" font-weight="800">The Loop</text>
  <text x="620" y="74" text-anchor="middle" fill="#5F6B7A" font-size="15">How this repository improves itself, monthly</text>

  <!-- Stage 1: Research in (teal) -->
  <rect x="40" y="120" width="200" height="150" rx="14" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2" filter="url(#s)"/>
  <rect x="40" y="120" width="200" height="40" rx="14" fill="#14B8A6"/>
  <rect x="40" y="146" width="200" height="14" fill="#14B8A6"/>
  <text x="140" y="146" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Research in</text>
  <text x="140" y="188" text-anchor="middle" fill="#5F6B7A" font-size="13">HBR · MIT Sloan PDFs</text>
  <text x="140" y="210" text-anchor="middle" fill="#5F6B7A" font-size="13">every page read in full</text>
  <text x="140" y="240" text-anchor="middle" fill="#0F766E" font-size="12" font-weight="700">~80 articles / quarter</text>

  <!-- Arrow 1 -->
  <path d="M 246 195 L 288 195" stroke="#9CA3AF" stroke-width="2" fill="none"/>
  <polygon points="288,190 298,195 288,200" fill="#9CA3AF"/>

  <!-- Stage 2: Application cards (purple) -->
  <rect x="300" y="120" width="200" height="150" rx="14" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" filter="url(#s)"/>
  <rect x="300" y="120" width="200" height="40" rx="14" fill="#8B5CF6"/>
  <rect x="300" y="146" width="200" height="14" fill="#8B5CF6"/>
  <text x="400" y="146" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Application cards</text>
  <text x="400" y="188" text-anchor="middle" fill="#5F6B7A" font-size="13">one per article:</text>
  <text x="400" y="210" text-anchor="middle" fill="#5F6B7A" font-size="13">exact target · evidence tier</text>
  <text x="400" y="240" text-anchor="middle" fill="#6D28D9" font-size="12" font-weight="700">every rule knows when it's wrong</text>

  <!-- Arrow 2 -->
  <path d="M 506 195 L 548 195" stroke="#9CA3AF" stroke-width="2" fill="none"/>
  <polygon points="548,190 558,195 548,200" fill="#9CA3AF"/>

  <!-- Stage 3: Canon updated (amber) -->
  <rect x="560" y="120" width="200" height="150" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" filter="url(#s)"/>
  <rect x="560" y="120" width="200" height="40" rx="14" fill="#F59E0B"/>
  <rect x="560" y="146" width="200" height="14" fill="#F59E0B"/>
  <text x="660" y="146" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">The canon updated</text>
  <rect x="576" y="174" width="168" height="24" rx="7" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
  <text x="660" y="191" text-anchor="middle" fill="#B45309" font-size="12" font-weight="600">80 skills</text>
  <rect x="576" y="204" width="168" height="24" rx="7" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
  <text x="660" y="221" text-anchor="middle" fill="#B45309" font-size="12" font-weight="600">4 published article series</text>
  <rect x="576" y="234" width="168" height="24" rx="7" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
  <text x="660" y="251" text-anchor="middle" fill="#B45309" font-size="12" font-weight="600">the AI playbook</text>

  <!-- Arrow 3 -->
  <path d="M 766 195 L 808 195" stroke="#9CA3AF" stroke-width="2" fill="none"/>
  <polygon points="808,190 818,195 808,200" fill="#9CA3AF"/>

  <!-- Stage 4: Adversarial QA (cyan) -->
  <rect x="820" y="120" width="200" height="150" rx="14" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2" filter="url(#s)"/>
  <rect x="820" y="120" width="200" height="40" rx="14" fill="#06B6D4"/>
  <rect x="820" y="146" width="200" height="14" fill="#06B6D4"/>
  <text x="920" y="146" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Adversarial QA</text>
  <text x="920" y="188" text-anchor="middle" fill="#5F6B7A" font-size="13">every number traced back</text>
  <text x="920" y="210" text-anchor="middle" fill="#5F6B7A" font-size="13">to the source's own sentence</text>
  <text x="920" y="240" text-anchor="middle" fill="#0E7490" font-size="12" font-weight="700">tiers never rounded up</text>

  <!-- Arrow 4 -->
  <path d="M 1026 195 L 1068 195" stroke="#9CA3AF" stroke-width="2" fill="none"/>
  <polygon points="1068,190 1078,195 1068,200" fill="#9CA3AF"/>

  <!-- Stage 5: Shipped (green) -->
  <rect x="1080" y="145" width="120" height="100" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" filter="url(#s)"/>
  <text x="1140" y="185" text-anchor="middle" fill="#065F46" font-size="15" font-weight="800">Pushed</text>
  <text x="1140" y="207" text-anchor="middle" fill="#16A34A" font-size="13" font-weight="600">to GitHub</text>
  <text x="1140" y="228" text-anchor="middle" fill="#5F6B7A" font-size="12">versioned · tracked</text>

  <!-- Return loop -->
  <path d="M 1140 251 L 1140 340 Q 1140 380 1100 380 L 180 380 Q 140 380 140 340 L 140 276"
        stroke="#6B7280" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
  <polygon points="135,280 140,268 145,280" fill="#6B7280"/>
  <rect x="380" y="352" width="520" height="56" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#s)"/>
  <text x="640" y="376" text-anchor="middle" fill="#1B1B1F" font-size="14" font-weight="700">Each run's lessons are written back into the engine itself</text>
  <text x="640" y="396" text-anchor="middle" fill="#5F6B7A" font-size="13">a new failure class becomes a new gate — the loop improves the loop</text>

  <!-- Insight strip -->
  <rect x="240" y="448" width="760" height="58" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="620" y="472" text-anchor="middle" fill="#6D28D9" font-size="14" font-weight="800">What you're reading got sharper last month, and will be sharper next month</text>
  <text x="620" y="493" text-anchor="middle" fill="#78716C" font-size="13">research that never ships is overhead — this loop exists so every insight lands somewhere real</text>

  <text x="620" y="538" text-anchor="middle" fill="#9CA3AF" font-size="12">rtp-personal-skills · the monthly research engine (rtp-hbr-research v3.0) · July 2026</text>
</svg>
